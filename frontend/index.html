<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CSS - Horas Extras</title>
</head>
<body>

<h2>Subir Talonario</h2>
<input type="file" id="talonario">
<button onclick="upload('talonario')">Subir</button>

<h2>Subir Cédula</h2>
<input type="file" id="cedula">
<button onclick="upload('cedula')">Subir</button>

<hr>

<h2>Login Administrador</h2>
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Ingresar</button>

<hr>

<h2>Panel Admin</h2>
<button onclick="loadFiles()">Ver Archivos</button>
<table border="1">
<thead>
<tr><th>Tipo</th><th>Archivo</th><th>Acciones</th></tr>
</thead>
<tbody id="files"></tbody>
</table>

<script>
const API = 'http://localhost:3000';

function upload(type) {
    const fileInput = document.getElementById(type);
    const form = new FormData();
    form.append('file', fileInput.files[0]);
    form.append('type', type);

    fetch(API + '/upload', { method: 'POST', body: form })
        .then(() => alert('Archivo subido'));
}

function login() {
    fetch(API + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: user.value,
            password: pass.value
        })
    })
    .then(res => res.json())
    .then(data => {
        localStorage.setItem('token', data.token);
        alert('Login correcto');
    });
}

function loadFiles() {
    fetch(API + '/files', {
        headers: { 'Authorization': localStorage.getItem('token') }
    })
    .then(res => res.json())
    .then(data => {
        files.innerHTML = '';
        data.talonarios.forEach(f => row('talonarios', f));
        data.cedulas.forEach(f => row('cedulas', f));
    });
}

function row(type, name) {
    files.innerHTML += `
    <tr>
        <td>${type}</td>
        <td>${name}</td>
        <td>
            <a href="${API}/download/${type}/${name}" target="_blank">Descargar</a>
            <button onclick="del('${type}','${name}')">Eliminar</button>
        </td>
    </tr>`;
}

function del(type, name) {
    fetch(`${API}/delete/${type}/${name}`, {
        method: 'DELETE',
        headers: { 'Authorization': localStorage.getItem('token') }
    })
    .then(() => loadFiles());
}
</script>

</body>
</html>
