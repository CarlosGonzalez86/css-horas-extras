<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login & Registro - Dirección Nacional de Seguridad Institucional</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        :root {
            --bg-color: #0A1A2A;
            --text-color: white;
            --card-bg: white;
            --card-text: #0A1A2A;
            --primary-color: #123456;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        /* Modo oscuro automático */
        .dark-mode {
            --bg-color: #000814;
            --text-color: #e0e0e0;
            --card-bg: #1b1b1b;
            --card-text: #e0e0e0;
        }

        /* Fondo animado */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            animation: float 10s linear infinite;
        }

        @keyframes float {
            from { transform: translateY(100vh); opacity: 0.2; }
            to { transform: translateY(-10vh); opacity: 0.9; }
        }

        /* Contenedor principal */
        .container {
            width: 350px;
            max-width: 90%;
            margin: 120px auto;
        }

        /* Contenedor del login/registro */
        .auth-container {
            background: var(--card-bg);
            color: var(--card-text);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 25px rgba(255,255,255,0.25);
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            animation: fadeIn 1.4s ease forwards;
            transition: transform 0.3s ease;
        }

        .auth-container:hover {
            transform: scale(1.02);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo responsive */
        .logo {
            width: 80px;
            max-width: 30%;
            display: block;
            margin: 0 auto 15px auto;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 4px rgba(255,255,255,0.3)); }
            to { filter: drop-shadow(0 0 12px rgba(255,255,255,0.8)); }
        }

        /* Título */
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--card-text);
            width: 0;
            animation: typing 2s steps(40) forwards, blink 0.7s infinite;
        }

        @keyframes typing {
            to { width: 100%; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* Inputs */
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid var(--card-text);
            border-radius: 5px;
            font-size: 16px;
            background: var(--card-bg);
            color: var(--card-text);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(18,52,86,0.5);
            outline: none;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Botón principal */
        button {
            width: 100%;
            padding: 12px;
            background: var(--card-text);
            color: var(--card-bg);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.2s ease;
            animation: pulse 2s infinite;
            margin-top: 15px;
        }

        button:hover {
            background: var(--primary-color);
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 12px rgba(255,255,255,0.5); }
            100% { box-shadow: 0 0 0px rgba(255,255,255,0.3); }
        }

        /* Botón secundario */
        .btn-toggle {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 10px;
            margin-top: 15px;
            animation: none;
            font-size: 14px;
        }

        .btn-toggle:hover {
            background: var(--primary-color);
            color: var(--card-bg);
        }

        /* Shake error */
        .shake {
            animation: shakeAnim 0.4s;
        }

        @keyframes shakeAnim {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
            100% { transform: translateX(0); }
        }

        /* Mensajes */
        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .message.error {
            background: var(--error-color);
            color: white;
            display: block;
        }

        .message.success {
            background: var(--success-color);
            color: white;
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
        }

        /* Ocultar formularios */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        /* Indicador de fortaleza de contraseña */
        .password-strength {
            margin-top: 5px;
            height: 4px;
            border-radius: 2px;
            background: #ccc;
        }

        .password-strength.weak {
            background: var(--error-color);
        }

        .password-strength.medium {
            background: #ffc107;
        }

        .password-strength.strong {
            background: var(--success-color);
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
        }

        /* 📱 RESPONSIVE PARA CELULARES */
        @media (max-width: 480px) {
            .auth-container {
                margin-top: 60px;
                padding: 20px;
            }

            h2 {
                font-size: 18px;
            }

            input, select {
                font-size: 14px;
                padding: 10px;
            }

            button {
                font-size: 14px;
                padding: 10px;
            }

            .logo {
                width: 60px;
            }
        }

        /* 💻 RESPONSIVE PARA PANTALLAS GRANDES */
        @media (min-width: 1200px) {
            .auth-container {
                width: 420px;
            }

            h2 {
                font-size: 26px;
            }

            input, button, select {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="particles"></div>

    <div class="container">
        <div class="auth-container" id="authBox">

            <img src="cajaLogo.png" class="logo" alt="Logo">

            <!-- FORMULARIO DE LOGIN -->
            <div class="form-section active" id="loginForm">
                <h2>Acceso Institucional</h2>
                
                <div class="message error" id="loginError"></div>

                <form id="formLogin">
                    <label>Usuario</label>
                    <input id="user" type="text" placeholder="Ingrese su usuario" required>

                    <label>Contraseña</label>
                    <input id="pass" type="password" placeholder="Ingrese su contraseña" required>

                    <button type="submit">Ingresar</button>
                </form>

                <button class="btn-toggle" onclick="toggleForms()">
                    ¿No tienes cuenta? Regístrate aquí
                </button>
            </div>

            <!-- FORMULARIO DE REGISTRO -->
            <div class="form-section" id="registerForm">
                <h2>Crear Cuenta</h2>
                
                <div class="message error" id="registerError"></div>
                <div class="message success" id="registerSuccess"></div>

                <form id="formRegister">
                    <label>Nombre Completo</label>
                    <input id="fullname" type="text" placeholder="Ej: Juan Pérez" required>

                    <label>Email</label>
                    <input id="email" type="email" placeholder="Ej: juan@example.com" required>

                    <label>Usuario</label>
                    <input id="username" type="text" placeholder="Ej: juan_perez" required>

                    <label>Contraseña</label>
                    <input id="newpass" type="password" placeholder="Mínimo 8 caracteres" required>
                    <div class="password-strength" id="strengthBar"></div>
                    <div class="strength-text" id="strengthText"></div>

                    <label>Confirmar Contraseña</label>
                    <input id="confirmpass" type="password" placeholder="Confirme su contraseña" required>

                    <label>Departamento</label>
                    <select id="department" required>
                        <option value="">Seleccione un departamento</option>
                        <option value="rh">Recursos Humanos</option>
                        <option value="it">Tecnología</option>
                        <option value="finance">Finanzas</option>
                        <option value="operations">Operaciones</option>
                        <option value="security">Seguridad</option>
                    </select>

                    <button type="submit">Registrarse</button>
                </form>

                <button class="btn-toggle" onclick="toggleForms()">
                    ¿Ya tienes cuenta? Inicia sesión aquí
                </button>
            </div>

            <div class="footer">
                Dirección Nacional de Seguridad Institucional<br>
                Caja de Seguro Social
            </div>
        </div>
    </div>

    <script>
        /* ========== CONFIG ========== */
        // Usa la misma origin donde se sirve la página, o localhost:3000 como fallback
        const API_BASE = window.location.origin || 'http://localhost:3000';

        /* ========== PARTÍCULAS ANIMADAS ========== */
        const particlesContainer = document.querySelector('.particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (6 + Math.random() * 6) + 's';
            p.style.opacity = Math.random();
            particlesContainer.appendChild(p);
        }

        /* ========== MODO OSCURO AUTOMÁTICO ========== */
        const hour = new Date().getHours();
        if (hour >= 18 || hour <= 6) {
            document.body.classList.add("dark-mode");
        }

        /* ========== ALTERNANCIA ENTRE FORMULARIOS ========== */
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authBox = document.getElementById('authBox');

            loginForm.classList.toggle('active');
            registerForm.classList.toggle('active');
            authBox.classList.remove('shake');
            
            // Limpiar mensajes
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('registerSuccess').style.display = 'none';
        }

        /* ========== INDICADOR DE FORTALEZA DE CONTRASEÑA ========== */
        document.getElementById('newpass').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');

            if (password.length < 8) {
                strengthBar.className = 'password-strength weak';
                strengthText.textContent = 'Mínimo 8 caracteres';
            } else if (password.match(/^[a-zA-Z0-9]+$/) && password.length < 12) {
                strengthBar.className = 'password-strength weak';
                strengthText.textContent = '❌ Débil';
            } else if (password.match(/[a-z]/) && password.match(/[A-Z]/) && password.match(/[0-9]/)) {
                if (password.length < 12) {
                    strengthBar.className = 'password-strength medium';
                    strengthText.textContent = '⚠️ Media';
                } else {
                    strengthBar.className = 'password-strength strong';
                    strengthText.textContent = '✅ Fuerte';
                }
            } else {
                strengthBar.className = 'password-strength weak';
                strengthText.textContent = '❌ Débil';
            }
        });

        /* ========== HELPERS ========== */
        function showError(element, text) {
            element.textContent = text;
            element.style.display = 'block';
        }
        function clearMessages() {
            ['loginError','registerError','registerSuccess'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
        }

        /* ========== VALIDACIÓN Y SUBMIT DEL LOGIN (ahora llama al backend) ========== */
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const loginError = document.getElementById('loginError');
            const authBox = document.getElementById('authBox');

            clearMessages();

            if (user === '' || pass === '') {
                showError(loginError, '❌ Por favor, completa todos los campos');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            try {
                const res = await fetch(API_BASE + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user, pass })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(loginError, '❌ ' + (data.error || 'Error en el login'));
                    authBox.classList.add('shake');
                    setTimeout(() => authBox.classList.remove('shake'), 500);
                    return;
                }

                // Guardar token y usuario
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirigir o mostrar mensaje
                alert('✅ Bienvenido, ' + data.user.username + '!');
                // Si quieres redirigir:
                // window.location.href = '/dashboard.html';

            } catch (err) {
                console.error(err);
                showError(loginError, '❌ Error de conexión con el servidor');
            }
        });

        /* ========== VALIDACIÓN Y SUBMIT DEL REGISTRO (ahora llama al backend) ========== */
        document.getElementById('formRegister').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const newpass = document.getElementById('newpass').value;
            const confirmpass = document.getElementById('confirmpass').value;
            const department = document.getElementById('department').value;
            const registerError = document.getElementById('registerError');
            const registerSuccess = document.getElementById('registerSuccess');
            const authBox = document.getElementById('authBox');

            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';

            // Validaciones
            if (!fullname || !email || !username || !newpass || !confirmpass || !department) {
                showError(registerError, '❌ Por favor, completa todos los campos');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            if (!email.includes('@')) {
                showError(registerError, '❌ El email no es válido');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            if (username.length < 4) {
                showError(registerError, '❌ El usuario debe tener al menos 4 caracteres');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            if (newpass.length < 8) {
                showError(registerError, '❌ La contraseña debe tener al menos 8 caracteres');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            if (newpass !== confirmpass) {
                showError(registerError, '❌ Las contraseñas no coinciden');
                authBox.classList.add('shake');
                setTimeout(() => authBox.classList.remove('shake'), 500);
                return;
            }

            try {
                const res = await fetch(API_BASE + '/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, username, password: newpass, department })
                });
                const data = await res.json();
                if (!res.ok) {
                    showError(registerError, '❌ ' + (data.error || 'Error en registro'));
                    authBox.classList.add('shake');
                    setTimeout(() => authBox.classList.remove('shake'), 500);
                    return;
                }

                // Guardar token y mostrar éxito
                registerSuccess.textContent = '✅ ¡Cuenta creada exitosamente!';
                registerSuccess.style.display = 'block';
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Limpiar y volver a login
                setTimeout(() => {
                    document.getElementById('formRegister').reset();
                    toggleForms();
                }, 1200);

            } catch (err) {
                console.error(err);
                showError(registerError, '❌ Error de conexión con el servidor');
            }
        });

        /* ========== Opcional: función para obtener datos del usuario con el token ==========
           Ejemplo de uso: obtener perfil y mostrar en dashboard
        */
        async function me() {
            const token = localStorage.getItem('token');
            if (!token) return null;
            try {
                const res = await fetch(API_BASE + '/api/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) return null;
                const data = await res.json();
                return data.user;
            } catch (err) {
                return null;
            }
        }

    </script>

</body>
</html>
