<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Dirección Nacional de Seguridad Institucional</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0A1A2A; /* Azul oscuro */
            color: white;
        }

        .login-container {
            width: 350px;
            margin: 120px auto;
            background: white;
            color: #0A1A2A;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #0A1A2A;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0A1A2A;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #123456;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Acceso Institucional</h2>

        <form action="dashboard.html" method="GET">
            <label>Usuario</label>
            <input type="text" placeholder="Ingrese su usuario" required>

            <label>Contraseña</label>
            <input type="password" placeholder="Ingrese su contraseña" required>

            <button type="submit">Ingresar</button>
        </form>

        <div class="footer">
            Dirección Nacional de Seguridad Institucional<br>
            Caja de Seguro Social
        </div>
    </div>

</body>
</html>
